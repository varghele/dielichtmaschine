[pytest]
testpaths = tests
markers =
    integration: marks tests requiring network/hardware (deselect with '-m "not integration"')
    visual: marks visual/manual tests
    e2e: marks end-to-end GUI workflow tests (offscreen Qt, no network)
    gl: marks tests needing a real OpenGL context (skip headless CI)
# pytest-timeout: a per-test HANG budget, not a stopwatch (the slowest
# test takes under a second). The thread method is the one that fires
# while a C++ Qt event loop blocks (an unplanned modal); it dumps every
# thread's stack and ends the process, which xdist reports as a crashed
# worker. Override per test with @pytest.mark.timeout(N).
timeout = 120
timeout_method = thread
